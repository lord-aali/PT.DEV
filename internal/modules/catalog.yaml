# PT.DEV module catalog — pin versions and per-OS download URLs.
#
# PHP Linux builds use shivammathur/php-builder (NTS, not -zts, not -dbgsym).
# Layout is Debian-style (usr/bin/php8.x); ptdev creates php / php-cgi aliases.
# Default distro pin: ubuntu24.04 (current LTS; best general glibc baseline).
# Prefer .tar.xz over .tar.zst for wider extract support.
#
# Arch notes:
# - Windows ARM64: no official PHP/Apache/MariaDB builds — use amd64 under WoA emulation.
# - macOS PHP: php-builder has no Darwin assets; leave unset until a portable Mac URL is chosen.
# - MariaDB 11.4.5 (catalog key "mysql", engine mariadb): linux x86_64 + windows x64 only.
# - Oracle MySQL Community 8.0.41 (engine mysql): windows + linux amd64 from cdn.mysql.com archives.
# - PostgreSQL 16.15 (engine postgres): theseus-rs binaries (win/linux/darwin amd64+arm64).
# - Apache: Windows = Apache Lounge; Linux amd64 + Darwin arm64 = nks-hub portable builds.
#   No official portable httpd for linux/arm64 or darwin/amd64.

composer:
  version: "2.8.8"
  artifacts:
    - os: any
      arch: any
      url: "https://getcomposer.org/download/2.8.8/composer.phar"
      filename: "composer.phar"
      kind: file

